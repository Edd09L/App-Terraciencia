<!DOCTYPE html>
<html>

<head>
  <base href="/App-Terraciencia/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description"
    content="Terraciencia Inclusiva - Viaje espacial interactivo por las ciencias naturales para todos.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="terraciencia">

  <title>Terraciencia Inclusiva</title>
  <style>
    body {
      background-color: #000000;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
  <script src="flutter.js" defer></script>
</head>

<body>
  <script>
    window.addEventListener('load', function (ev) {
      _flutter.loader.loadEntrypoint({
        onEntrypointLoaded: function (engineInitializer) {
          engineInitializer.initializeEngine().then(function (appRunner) {
            appRunner.runApp();
          });
        }
      });
    });

    // Funciones de Lector de Voz (TTS) integradas para accesibilidad
    window.speakText = function (text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Detener cualquier reproducción previa

        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'es-GT'; // Español (Guatemala) como preferencia principal

        // Intentar encontrar una voz en español adecuada
        var voices = window.speechSynthesis.getVoices();
        var esVoice = voices.find(function (voice) {
          return voice.lang === 'es-GT' || voice.lang.startsWith('es-');
        });
        if (esVoice) {
          utterance.voice = esVoice;
        }

        utterance.pitch = 1.05; // Tono amigable
        utterance.rate = 0.85;  // Velocidad más lenta para facilitar la comprensión cognitiva

        window.speechSynthesis.speak(utterance);
      } else {
        console.warn("La síntesis de voz no está soportada en este navegador.");
      }
    };

    window.stopSpeaking = function () {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    };
  </script>
</body>

</html>
